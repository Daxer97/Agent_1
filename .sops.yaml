# Encryption rules for the bootstrap credentials.
#
# Each secrets file is encrypted for exactly two recipients: the administrator
# and the host that must read it. Nobody else. A rule broad enough to let one
# guest decrypt another guest's file defeats the separation of policies before
# any policy is ever consulted, and it does so silently — the deployment
# succeeds either way.
#
# The host keys are derived from the SSH host key of each guest:
#
#     ssh <guest> "cat /etc/ssh/ssh_host_ed25519_key.pub" | ssh-to-age
#
# After registering a key, re-encrypt the file it applies to:
#
#     sops updatekeys secrets/<host>.yaml
#
# The file names match the host names declared in parameters.nix: hrm-edge,
# hrm-app, hrm-mem, hrm-sec.
#
# The five keys below are the only values here that cannot be filled in
# advance. The administrator's key is produced by `age-keygen` on the
# workstation; the four host keys do not exist until the guests do, because
# they are derived from each guest's SSH host key with the command above. Their
# markers are left in place so that `nix flake check` keeps reporting them by
# name until they are registered.

keys:
  - &admin PLACEHOLDER_AGE_KEY_ADMIN
  - &host_ingress PLACEHOLDER_AGE_KEY_INGRESS
  - &host_agent PLACEHOLDER_AGE_KEY_AGENT
  - &host_memory PLACEHOLDER_AGE_KEY_MEMORY
  - &host_secrets PLACEHOLDER_AGE_KEY_SECRETS

creation_rules:
  - path_regex: secrets/hrm-edge\.yaml$
    key_groups: [{ age: [*admin, *host_ingress] }]

  - path_regex: secrets/hrm-app\.yaml$
    key_groups: [{ age: [*admin, *host_agent] }]

  - path_regex: secrets/hrm-mem\.yaml$
    key_groups: [{ age: [*admin, *host_memory] }]

  # The observability role is aliased onto the secret store guest, so it reads
  # the same file. Separating the two roles means adding a rule here and a key
  # above, and nothing else.
  - path_regex: secrets/hrm-sec\.yaml$
    key_groups: [{ age: [*admin, *host_secrets] }]
